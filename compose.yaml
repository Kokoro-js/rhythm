name: rhythm

services:
  rhythm:
    image: ${RHYTHM_IMAGE:-ghcr.io/pluxeljs/rhythm:latest}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      PLUXEL_WORKBENCH: ${PLUXEL_WORKBENCH:-true}
      RHYTHM_REQUIRE_POSTGRES: ${RHYTHM_REQUIRE_POSTGRES:-true}
      RHYTHM_FIX_OWNERSHIP: ${RHYTHM_FIX_OWNERSHIP:-false}
    volumes:
      - ${RHYTHM_DATA_DIR:-./data}:/var/lib/rhythm
      - ${RHYTHM_MUSIC_DIR:-./music}:/music:ro
    ports:
      - ${RHYTHM_HOST_BIND:-127.0.0.1}:${RHYTHM_HOST_PORT:-3311}:3311

  gateway:
    image: ${RHYTHM_GATEWAY_IMAGE:-ghcr.io/pluxeljs/rhythm-gateway:latest}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      rhythm:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - ${RHYTHM_GATEWAY_BIND:-127.0.0.1}:${RHYTHM_GATEWAY_PORT:-3310}:8080
