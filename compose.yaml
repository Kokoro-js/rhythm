name: rhythm

services:
  rhythm:
    image: ${RHYTHM_IMAGE_REGISTRY:-ghcr.io/pluxeljs}/rhythm:${RHYTHM_VERSION:-latest}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      RHYTHM_PUBLIC_URL: '${RHYTHM_PUBLIC_URL:?set RHYTHM_PUBLIC_URL to the exact public origin}'
      RHYTHM_GATEWAY_URL: '${RHYTHM_GATEWAY_URL:?set RHYTHM_GATEWAY_URL to the exact public API gateway origin}'
      RHYTHM_ALLOWED_ORIGINS: '${RHYTHM_ALLOWED_ORIGINS:-[]}'
      PLUXEL_WORKBENCH: 'true'
    volumes:
      - ${RHYTHM_DATA_DIR:-./data}:/var/lib/rhythm
      - ${RHYTHM_MUSIC_DIR:-./music}:/music:ro
    ports:
      - '127.0.0.1:3311:3311'

  gateway:
    image: ${RHYTHM_IMAGE_REGISTRY:-ghcr.io/pluxeljs}/rhythm-gateway:${RHYTHM_VERSION:-latest}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      rhythm:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - '127.0.0.1:3310:3310'
