services:
  caddy:
    build:
      context: .
      dockerfile: Caddy.cloudflare.Dockerfile
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      CF_API_TOKEN: '${CF_API_TOKEN:?set a scoped Cloudflare API token for DNS-01}'
      RHYTHM_PUBLIC_URL: '${RHYTHM_PUBLIC_URL:?set RHYTHM_PUBLIC_URL to https://hostname:31083}'
    volumes:
      - ./Caddyfile.cloudflare:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '31083:31083'
      - '31083:31083/udp'

volumes:
  caddy_data:
  caddy_config:
