services:
  caddy:
    image: ${RHYTHM_CADDY_IMAGE:-docker.io/library/caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      RHYTHM_DOMAIN: '${RHYTHM_DOMAIN:?set RHYTHM_DOMAIN to the public hostname without a scheme}'
      RHYTHM_CADDY_TLS_DIRECTIVE: '${RHYTHM_CADDY_TLS_DIRECTIVE:-}'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'

volumes:
  caddy_data:
  caddy_config:
