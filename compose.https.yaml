services:
  gateway:
    environment:
      CF_API_TOKEN: '${CF_API_TOKEN:?set a scoped Cloudflare API token for DNS-01}'
    volumes:
      - ./Caddyfile.cloudflare:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '31083:31083'
      - '31083:31083/udp'

volumes:
  caddy_data:
  caddy_config:
