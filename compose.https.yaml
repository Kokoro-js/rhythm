services:
  caddy:
    build:
      context: .
      dockerfile: Caddy.cloudflare.Dockerfile
      args:
        CADDY_VERSION: ${RHYTHM_CADDY_VERSION:-2.11.4}
        CADDY_CLOUDFLARE_VERSION: ${RHYTHM_CADDY_CLOUDFLARE_VERSION:-v0.2.4}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      CF_API_TOKEN: '${CF_API_TOKEN:?set a scoped Cloudflare API token for DNS-01}'
      RHYTHM_DOMAIN: '${RHYTHM_DOMAIN:?set RHYTHM_DOMAIN to the public hostname}'
    volumes:
      - ./Caddyfile.cloudflare:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '${RHYTHM_CADDY_BIND:-0.0.0.0}:${RHYTHM_PUBLIC_PORT:-31083}:443'
      - '${RHYTHM_CADDY_BIND:-0.0.0.0}:${RHYTHM_PUBLIC_PORT:-31083}:443/udp'

volumes:
  caddy_data:
  caddy_config:
