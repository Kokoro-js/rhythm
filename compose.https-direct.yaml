services:
  gateway:
    environment:
      RHYTHM_GATEWAY_URL: '${RHYTHM_GATEWAY_URL:?set RHYTHM_GATEWAY_URL to the public gateway HTTPS origin}'
      RHYTHM_CADDY_TLS_DIRECTIVE: '${RHYTHM_CADDY_TLS_DIRECTIVE:-}'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '80:3080'
      - '443:3443'
      - '443:3443/udp'

volumes:
  caddy_data:
  caddy_config:
